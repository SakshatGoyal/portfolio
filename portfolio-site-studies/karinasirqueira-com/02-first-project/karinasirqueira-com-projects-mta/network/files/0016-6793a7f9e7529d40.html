<script type="application/ld+json">{"embedUrl":"https://player.vimeo.com/video/470020599?h=74757d3b17","thumbnailUrl":"https://i.vimeocdn.com/video/978387581-2f03bac903f7453ef0db7859729e41b8d79bb9167b1f0e72b9685ea7181ff343-d?f=webp","name":"The Map","description":"\"The Map\" (Work \u0026 Co x Gary Hustwit, 2020) is a short documentary about a digital redesign of New York City's iconic subway map. Filmmaker Gary Hustwit documents the process as digital agency Work \u0026 Co creates a new \"live map\" — one that updates in real-time — to help New Yorkers and tourists better plan their journeys. The film examines the evolution of wayfinding and user interfaces, and shows how good design and the latest digital technology can simplify one of the world's most complex transit systems. Featuring Felipe Memoria, Rachel Haot, Sarah Meyer, Joshua Gee, Marcela Abbade, Karina Sirqueira, Robert Penner, and Mohan Ramaswamy.\n\nhttps://map.mta.info/\n\nhttps://work.co/news/mta-new-live-subway-map/","duration":"PT603S","uploadDate":"2020-10-19T22:08:57-04:00","@context":"https://schema.org/","@type":"VideoObject"}</script>
