    - iframe [ref=e38]:
      
    - heading "Spotify let users relive the moments and music that made up 2015." [level=2] [ref=e49]
    - generic [ref=e54]:
      - img "lizvwells-casestudy-yearinmusic-sketch1" [ref=e57]
      - heading "EARLY FLOW AND WIREFRAME SKETCHES" [level=6] [ref=e61]
    - generic [ref=e64]:
      - heading "About the Project" [level=2] [ref=e72]
      - paragraph [ref=e78]: From global data to personal insights, users could explore theirs top listens and the world’s. With an audience of millions, we needed to create an experience that captured Spotify’s connection to both music and culture using a large amount of data. We worked alongside Spotify to concept, write, design, and build the Year in Music campaign as well as supporting media that included digital display advertising, OOH advertising, and short online spots.
    - generic [ref=e83]:
      - img "lizvwells-casestudy-yearinmusic-sketch2" [ref=e86]
      - heading "BREAK DOWN OF LOGGED IN EXPERIENCE AND GLOBAL (LOGGED OUT) EXPERIENCE" [level=6] [ref=e90]: BREAK DOWN OF LOGGED IN EXPERIENCE AND GLOBAL (LOGGED OUT) EXPERIENCE
    - generic [ref=e93]:
      - heading "UX Challenges" [level=2] [ref=e101]
      - paragraph [ref=e107]: Spotify users who logged in got personalized information about their listening habits, while users who didn't log in only got information about their country's data. Both experiences needed to feel immersive and share-worthy.
    - generic [ref=e112]:
      - img "lizvwells-casestudy-yearinmusic-sketch3" [ref=e115]
      - heading "EARLY SKETCHES OF FLOW AND SCREENS" [level=6] [ref=e119]: EARLY SKETCHES OF FLOW AND SCREENS
    - paragraph [ref=e130]: Since this experience was translated into 35 different languages for 52 countries, we had to think through multiple levels of affordances. All 45 pages had to work seamlessly for character based language and languages with different sentence structures while integrated automated data. We included seasonal data, but had to create affordances for countries in different hemispheres where the seasons flip.
    - generic [ref=e135]:
      - img "lizvwells-casestudy-yearinmusic-sketch4" [ref=e138]
      - heading "PAPER PROTOTYPES OF MOBILE SCREENS" [level=6] [ref=e142]: PAPER PROTOTYPES OF MOBILE SCREENS
    - paragraph [ref=e153]: The experience was long and complex- including 45 pages. We had to create a navigation pattern that allowed users to understand where they were in the flow and persistently share.
    - generic [ref=e158]:
      - img "lizvwells-casestudy-yearinmusic-mobilewires1" [ref=e161]
      - heading "MOBILE WIREFRAMES" [level=6] [ref=e165]
    - generic [ref=e168]:
      - heading "UX Solutions" [level=2] [ref=e176]
      - paragraph [ref=e182]: "We created two ways of exploring the data and stories: personalized experience for Spotify users or a global experience for non-Spotify users. The personalized experience demonstrates the detail Spotify’s user data. For instance, logged-in users saw: “What song helped you ring in the year,” “Which artists soundtracked your seasons,” “What was your weirdest outlier (most out of place song you listened to),” and “What were the stories from music and culture that made your year?” While the global user would general data from their country: top artists, top tracks, etc."
    - generic [ref=e187]:
      - img "lizvwells-casestudy-yearinmusic-mobilewires2" [ref=e190]
      - heading "MOBILE WIREFRAMES" [level=6] [ref=e194]
    - generic [ref=e204]:
      - paragraph [ref=e205]: To make sure the site could be accessed globally in multiple languages, we built a custom CMS so the Spotify team could switch the copy and content depending on the language and country.
      - paragraph [ref=e206]: The site’s structure was based in the seasons of 2015. The logged in user starts the experience with their first song of 2015. As the user scrolls, they progress through the year. When the user reaches a data point, “How many minutes did you listen in 2015?” the user would have a share button available so they can easily download the image or share directly to Facebook and Twitter. Users could jump ahead to different sections by using the hamburger nav that listed out all the main sections of the experience.
