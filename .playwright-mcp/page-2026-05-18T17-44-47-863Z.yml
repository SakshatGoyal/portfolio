    - paragraph [ref=e222]: After a year and a half of issues under our belt, in conjunction with our new tagline and mission, I rebranded our visual world to better reflect the community. The inclusion of softer typography balances out the hard san-serif, so I added Ogg and GT America to the family. I also expanded our color palette based on the most frequently used colors from our first brand system, and added many more to create a wider palette to reflect our expanding community and their identities.
