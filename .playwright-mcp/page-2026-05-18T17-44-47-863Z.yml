    - paragraph [ref=e248]: Since Desk Lunch is a weekly newsletter, I knew I could not make custom visuals for each issue. To ensure an overall visual language that reflects both our brand and the issue content, I pull public domain images from the art world that match the tone of the essays in each issue. The art world is where our industry stems from, and where many people in the creative industry first get inspired to pursue this field.
