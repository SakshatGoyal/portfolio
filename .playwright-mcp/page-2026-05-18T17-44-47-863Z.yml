    - generic [ref=e142]:
      - img "lizvwells-casestudy-desklunch-brandexplorations" [ref=e145]
      - heading "BRANDING OPTIONS" [level=6] [ref=e149]
    - generic [ref=e152]:
      - heading "Design Challenges" [level=2] [ref=e160]
      - generic [ref=e165]:
        - paragraph [ref=e166]: As the Design Director of this project, I wanted to create a system that broke away from the millennial pink aesthetic that is common and expected in this category. It was important that Desk Lunch didn’t blend into the mix of “projects for women by women.” As an initiative that champions and celebrates diversity and the full gender spectrum, I wanted our style to stand out as a unique offering.
        - paragraph [ref=e167]: Another aspect I had to keep in mind during this phase was how would this system work with a variety of articles and topics. I knew we needed to have an expansive color palette, type system, and imagery that would be flexible and easily replicable on a weekly basis.
    - generic [ref=e172]:
      - img "lizvwells-casestudy-desklunch-brandguidelines" [ref=e175]
      - heading "FIRST VERSION OF DESK LUNCH BRAND (LEFT) AND CURRENT BRAND (RIGHT)" [level=6] [ref=e179]
    - generic [ref=e182]:
      - heading "Design Solutions" [level=2] [ref=e190]
      - paragraph [ref=e196]: When we first launched in 2018, I created a palette using bold, warm colors and with a dark blue for balance. For added flexibility, I incorporated secondary colors that are less saturated versions of the primary palette. When creating the wordmark, I wanted a gender neutral typeface that highlights the community’s inclusive nature, ultimately choosing Univers for its versatility.
