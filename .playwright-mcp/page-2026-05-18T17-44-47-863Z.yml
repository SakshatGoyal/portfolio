    - img "lizvwells-casestudy-desklunch-heroimg" [ref=e37]
    - heading "Desk Lunch is a community for all creative people of marginalized genders. Since 2018, we have published a weekly newsletter featuring stories and thoughts from creative folks around the world." [level=2] [ref=e48]
    - generic [ref=e53]:
      - img "lizvwells-casestudy-desklunch-sketch1" [ref=e56]
      - heading "EARLY WORDMARK SKETCHES" [level=6] [ref=e60]
    - generic [ref=e63]:
      - heading "About the Project" [level=2] [ref=e71]
      - generic [ref=e76]:
        - paragraph [ref=e77]: Desk Lunch started as a project with a friend when we noticed a gap in the market for a platform that uplifts the stories of creatives of marginalized genders. Tired of seeing the same names gracing the covers of trade publications, headlining conferences, and appearing on podcasts, we decided to make a community that had intersectionality, diversity, and accessibility baked into its ethos from the beginning.
        - paragraph [ref=e78]: Knowing we could never adequately speak to the full range of issues faced by different marginalized communities, we decided to start a newsletter that would feature an essay from a different contributor every week.
    - generic [ref=e83]:
      - img "lizvwells-casestudy-desklunch-sketch2" [ref=e86]
      - heading "NEWSLETTER LAYOUT OPTIONS" [level=6] [ref=e90]
    - generic [ref=e100]:
      - paragraph [ref=e101]: "In May 2019, after a year and a half of lunches, we made some major updates to our brand. The first was a new tagline:"
      - paragraph [ref=e102]: Desk Lunch is a community for all creative people of marginalized gender.
      - paragraph
      - paragraph [ref=e103]: "We updated the language from our previous positioning:"
      - paragraph [ref=e104]: Desk Lunch is a weekly newsletter for all creative women and non-binary folks.
      - paragraph [ref=e105]: It's important for projects like ours to change and grow as our community does. We're listening to and learning from what folks in our community are saying, which is why we updated our tagline to be more inclusive of the full gender spectrum and everyone who makes Desk Lunch so very special.
      - paragraph [ref=e106]: To keep our community and the stories we share as accessible as possible, we chose to make Desk Lunch a newsletter sent every week via email to whomever subscribes. In the last year, we also started to roll out Desk Lunch IRL, live events which are recorded and published as issues for the rest of the community to enjoy.
