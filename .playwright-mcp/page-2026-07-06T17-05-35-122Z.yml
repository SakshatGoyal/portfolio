          - generic [ref=f324e194]:
            - heading "Product design portfolio presentation interview" [level=1] [ref=f324e195]
            - paragraph [ref=f324e196]:
              - text: "Hi Blind family! I recently got feedback for a portfolio presentation interview and was wondering if any senior product designers here can give me more insight so that I can improve :) This interview was 1 hr with the hiring manager and a senior product designer. The hiring manager said that my work is good but I need to work on storytelling. She said that I need to think about what to keep and take out for the presentation depending on the audience, in this case, 2 designers. I'm struggling with this because I feel like I need to talk about a lot of things so that my design process is clear and that the rationale behind my decisions are also clear. Here's an overview of how I presented: - overview of myself, what I'm passionate about as a designer, a brief on my journey to ux design, one of my top skills, what I do outside of work, my design philosophy, my design process, mentioned the 2 projects that I will talk about (5 min) - first project (30 min) -overview of what it is, my role, the team -problem space and what the user, product, business problems where, problem statement, constraints -overview of ux research efforts, what methods, user persona, user journey -design principles and how the problems and research insights derived each design principle -framed the design exploration before jumping into it by mentioning the constraints again -brief about logo design, style guide, design system since I had to develop these for the project too -dived deeper into the designs, briefly talked about iterations and the final design of a screen and how that addressed the problems and design principles I defined -talked about iterations of another screen and how I worked with an engineer on the tech constraint to reach the final design, also tied it back to the problems and design principles -then talked about a key user flow that addressed the problems and design principles, a brief on the iterations, showed a quick demo of this flow -then I showed a quick demo of an animation that also helped addressed one of the problems and design principles -after talking about the designs, I showed a glimpse of how I prepare them for handoff to engineers -overview of usability testing and qa testing, methods used, and also showed how I give qa feedback to engineers -impact and results, success metrics that we achieved -next steps, what user pain points we still need to address based on the feedback from testing, new design principles that I defined based on this for the next iteration -other next steps like what other data to track and what other use cases to explore -2nd project (10 min) -had the same structure as the first but not all of the steps so it was shorter -i didn't have much time left so I had to keep it short as well -then I wrapped up with key takeaways about me as a designer from these projects, showed a testimonial from a colleague supporting these as well, thanked the interviewers We then had 10 min for them to ask questions TC: 110K YOE: 2+ Thanks in advance! 🙏"
