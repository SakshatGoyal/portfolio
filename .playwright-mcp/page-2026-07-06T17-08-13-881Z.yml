          - generic [ref=f1759e200]:
            - heading "Are designers faking projects on their portfolios?" [level=1] [ref=f1759e201]
            - paragraph [ref=f1759e202]: "When I look at portfolios, I’ve noticed that I never see unglamorous projects. It made me wonder: are people making up projects that they worked on in their current/prior roles? For an easy-to-understand analogy: Sam was a UX designer at Microsoft in the past but is now at Google. He puts on his resume he works on Microsoft Teams. In reality, he works on an admin tool for Teams. He makes up a fake project about some unreleased feature for Teams proper, even though he never did any work on the Teams software itself—probably to impress the people interviewing him at Google. I am not interested in leaving my job anytime soon, but as someone who does the grunt admin/cloud design work, it’s discouraging to see people early in their careers getting to work on the software or apps instead of the less glamorous behind the scenes stuff after 7YOE + Master’s."
