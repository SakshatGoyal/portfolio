      - heading "KENAI FJORDS - GLACIER RECESSION INTERACTIVE EXPERIENCE" [level=6] [ref=e198]: KENAI FJORDS - GLACIER RECESSION INTERACTIVE EXPERIENCE
    - paragraph [ref=e209]: For Carlsbad Cavern, we focused on the life cycle of the Brazilian free-tailed bats and how they use the caves within the park during the summer on their migration path. The user is transformed into a bat and is able to echolocate important items around the cave. When the user finds food or the bat’s baby, the park ranger will then tell the user more about their findings. The user clicks and drags (the same interaction they use to explore all other 360° scenes), to find food and their baby bat in the dark cave. Items the user can interact with will echolocate and the user can respond back by clicking. The echolocation rings will become visible to the user.
    - generic [ref=e211]:
      - iframe [ref=e218]:
        
      - heading "CARLSBAD CAVERNS - BAT ECHOLOCATION INTERACTIVE EXPERIENCE" [level=6] [ref=e225]: CARLSBAD CAVERNS - BAT ECHOLOCATION INTERACTIVE EXPERIENCE
    - paragraph [ref=e236]: Bryce Canyon has one of the darkest night skies in America. Because of this, we let the user explore the Milky Way and learn about constellations through a local Native American tribe’s mythology. We selected five key constellations and planets a visitor to the park could see at Bryce on a dark night. We made sure that, in our designs, it was clear that users could select the items by making them more obvious through color, size, and adding animation. When the user selects a constellation, their counter at the bottom will increase for finding one. We wanted to make it immediately clear to the user that there were only so many constellations to find.
