  - generic [ref=e16]:
    - generic [ref=e21]:
      - heading "The Hidden Worlds of the National Parks" [level=1] [ref=e25]
      - heading "GOOGLE" [level=5] [ref=e29]
    - iframe [ref=e38]:
      
    - heading "In celebration of the hundred year anniversary of the National Parks Service, we created an interactive tour of five of America’s most beautiful national parks led by real park rangers." [level=2] [ref=e49]
    - generic [ref=e54]:
      - img "lizvwells-casestudy-hiddenworldsofthenationalparks-sketch1" [ref=e57]
      - heading "SKETCHES" [level=6] [ref=e61]
    - generic [ref=e64]:
      - heading "About the Project" [level=2] [ref=e72]
      - paragraph [ref=e78]: Using 16:9 video, 360° video and ambisonic audio, users were able to partake in experiences the average park visitor never gets to see. We shot from helicopters, mountain tops, horseback, and underwater, resulting in over eleven terabytes of footage gathered over twenty-six days and 18,949 miles, edited down to a final experience of twenty-five minutes.
    - generic [ref=e83]:
      - img "lizvwells-casestudy-hiddenworldsofthenationalparks-sketch2" [ref=e86]
      - heading "SKETCHES" [level=6] [ref=e90]
    - generic [ref=e93]:
      - heading "UX Challenges" [level=2] [ref=e101]
      - paragraph [ref=e107]: The content strategy was the first major UX hurdle since we needed to fully map out the digital experience in order to determine what content would need to be shot by the film crew and brought to life by our in-house motion team. After identifying which parks would be featured, we were tasked with creating interactive experiences that highlighted each park’s unique story and the range of diversity of America’s geography.
    - generic [ref=e112]:
      - img "lizvwells-casestudy-hiddenworldsofthenationalparks-sketch3" [ref=e115]
      - heading "SKETCHES" [level=6] [ref=e119]
    - paragraph [ref=e130]: The second major UX challenge was ensuring a simple and usable experience on every screen, while also allowing for multiple layers of content and navigation. Striking this balance required multiple rounds of prototyping and revisions. We needed to come up with a consistent way to organize all the content accompanying each park, as the site used a combination of different mediums. To ensure a consistent experience for all users, every piece of content needed to be fully accessible on desktop and mobile.
    - generic [ref=e135]:
      - img "lizvwells-casestudy-hiddenworldsofthenationalparks-desktopwires" [ref=e138]
      - heading "DESKTOP WIREFRAMES" [level=6] [ref=e142]
    - generic [ref=e145]:
      - heading "UX Solutions" [level=2] [ref=e153]
      - paragraph [ref=e159]: "To solve our UX challenges, we created a system with two major components: highlights, in which the user would stop and have the chance to engage with content before continuing through the experience, and hot spots, which included smaller, bite-sized content within each highlight. To help the user move between the content, users can always see an exit from of the content they are in, whether it be the map button to skip ahead to another location, the next button within a highlight or an X/back when a user is in an hotspot overlay. We made sure to only film park highlights in stationary points of view so the user will never nauseated when they are viewing this experience on desktop, mobile or Google Cardboard VR."
    - generic [ref=e164]:
      - img "lizvwells-casestudy-hiddenworldsofthenationalparks-mobilewires" [ref=e167]
      - heading "MOBILE WIREFRAMES" [level=6] [ref=e171]
    - paragraph [ref=e182]: For the interactive experiences, we used 360° animation, directional audio, and WebGL in Kenai Fjords, Bryce Canyon, and Carlsbad Cavern. In Kenai Fjords, we focused on the story of climate change. When the user enters Exit Glacier, they are able to use a slider to select a year to see how much the glacier has recessed over time To adjust the years, the UI was is a simple toggle with the park ranger giving a voice over description of glacier recession. We used 360°animation to make these interactive moments feel consistent with the rest of the experience.
