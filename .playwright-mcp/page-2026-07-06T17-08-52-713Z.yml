            - paragraph [ref=f2000e201]: I was impacted in late 2023 and took some time off before resuming my job search in January 2024. Since then, I joined a pre-funded startup for a mid this year for few months before transitioning to contract work as a product designer while actively looking for full-time roles. With 10+ years of design experience and 5+ years managing teams, I’ve aggressively applied to over 100 jobs in the past two weeks, receiving 5 rejections (personalized resumes) I’d like to get your perspective on the current product design market. I’ve heard the product management market is particularly challenging—how are things shaping up in design? Also, my portfolio currently features 2 case studies, with a third one in progress.
