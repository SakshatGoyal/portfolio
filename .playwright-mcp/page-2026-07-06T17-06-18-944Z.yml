                    - paragraph [ref=f432e253]: Hey this was super helpful Do you think applying early is necessary? I’m getting overwhelmed trying to apply as soon as stuff is posted, there’s so many roles popping up. I’m wondering if recruiters even look at week old roles
                  - generic [ref=f432e254]:
                    - button "Like comment" [ref=f432e255] [cursor=pointer]:
