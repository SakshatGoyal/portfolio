                    - paragraph [ref=f432e377]: I made and memorized a SQL cheat sheet; it’s a big fake query with all the key elements (windows, time range, join, grouping, etc). I’ve been doing PySpark for 7 years so I know queries like the back of my hand. Math/logic, again I have 20+ years of experience interviewing and have done countless brain teasers, logic puzzles, GRE prep, etc. “What’s the angle between big hand and little hand when it’s HH:MM” <—-I’ve done this problem over and over and over… I recommend spending a year solving little puzzles and problems and LC easy-type problems on paper or pseudocode. Learn to think algorithmically and decompose any problem into sub problems. Use every role as prep for the next role. Sorry this sounds like platitudes but it works. Hugh Jackman is only in Wolverine shape for a few days. It’s not sustainable to be like that every day. I get in interview shape by cramming puzzles and problems and system design. I don’t “lose it” all afterwards but I do get rusty again. The comparison between my first interview performance and my last is pretty extreme, almost like a different candidate. My inherent smarts and skills are only 50%, the other 50% comes from intense targeted prep work that is exhausting and can only happen for few weeks at a time. This is true for me, I imagine there are supergeniuses who don’t have to do interview prep.
