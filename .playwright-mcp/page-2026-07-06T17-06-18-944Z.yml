          - generic [ref=f432e199]:
            - heading "Staff Interviews (+offer)" [level=1] [ref=f432e200]
            - paragraph [ref=f432e201]:
              - text: "Background: Old TC: $470k (2025 number; would be lower in 2026 due to cliffs) I'm a male 45, 20+ years of experience, US citizen. I live in a non-tech hub (MCOL city). Experience: I prior worked for a tier-2 tech company and also for a hyperscaler (one of AWS, Google, or MSFT). I work in the data space (engineering, science, infrastructure). I started applying in November/December 2025 (lots of start/stop due to holidays). Preliminary Work: Using Gemini,"
              - link "Levels.fyi" [ref=f432e202] [cursor=pointer]:
                - /url: http://Levels.fyi
              - text: ", and Blind I came up with a list of ~50 companies I want to work for. My Excel includes TC for my estimated level, WLB rating, etc. Filtered down to companies that have at least *some* remote roles. It's companies like Databricks, Stripe, Lyft, etc., along with MSFT, GOOG, etc. Interview Prep: Lots of Gemini/Claude usage to create huge question banks (and also to refine my resume as I went). I would give the AI my resume and the job role and outline the interview rounds. I also used AI to give example coding problems and lots and lots of system design problems (with solutions). Cold Applications (via LinkedIn): At least 100 Used auto-filler extension to speed up process. Cold Messages (via LinkedIn): About 24 (only 2 responses) Results: *Note*: I call each distinct interview a \"round\" below except for DoorDash, who refers to the initial 60-minute coding+case study as \"Round 1\". I consider the recruiter screen as round 1. Motional: Cold Application (LinkedIn) (2 rounds: recruiter, system design) Did not proceed after system design. It was a game of \"what am I thinking?\" and I didn't know what he was thinking. I could have gone deeper (e.g. adding a caching layer above S3 in my diagram) to show my depth but didn't think of it, my fault. I was a bit rusty in this first interview. Databricks (two roles): A recruiter reached out via LinkedIn First Role: (~4 rounds: informal with HM, another team manager interview, Spark test, 2x technical interviews) Did extremely well talking to managers. 1st technical interview: I did pretty well but I did fumble 1 question on system performance (I attacked it from wrong angle). 2nd technical interview: I feel I did extremely well and really impressed the interviewer. Did not proceed futher. HM told me he needed two \"strong YESes\" to proceed, which I didn't get. He implied it was a culture fit issue. Second Role: (2 rounds, recuiter screen and HM screen) Did very well in both. Role required 50% travel which was a dealbreaker for me. I ended interview process due to offer (see below). Shopify: Cold Application (LinkedIn) (4 rounds: recruiter, hiring manager, logic/math test, SQL pair programming) I did well with HM; for logic/math test I feel I did extremely well. SQL pair programming I feel I did well but I went slightly too slow; I did not finish final (4th) question. Recruiter informed me they were ending the process. Not sure if it was due to culture fit or SQL test? Oracle: I reached out to recruiters (~1 round) A recruiter I was familiar with (they were my recruiter with the hyperscaler) is now at Oracle, so I reached out. They referred me to a 2nd recruiter who I had a call with. He didn't have any roles that match my skills but wanted me to keep checking in with him. DoorDash: Cold Application (LinkedIn) (1 round: Data Science) Recruiter emailed me a questionairre which I filled out. Did data science round (2x 30 minute sessions). I did extremely well in both and they wanted to progress to next round. I ended interview process due to offer (see below). Health AI Startup: Cold Application (LinkedIn) (5 rounds: recruiter, CTO, Founder, 2x system design) Did extremely well in every round and progressed to offer stage. I was hesitant due to it being a very early stage startup. They had never hired at my level before and asked me to make an inverse offer, which I did. I asked for massive salary and sign-on cash; they never responded! **OFFER** Unicorn Startup: A recruiter reached out to me (7 rounds: recruiter, HM screen, behavioral interview, skip-level screen, cross-functional interview, live coding interview, system design interview). I had a great experience and did very well in every interview. I progressed very quickly to offer stage which I accepted. Role is Staff SWE. New TC: About $600k, with more than half in salary+bonus and the rest in paper money, however they have liquidity events. Notes: Let me be candid: this was the smoothest job search of my life. I was getting lots of traction and didn't nearly exhaust my list of companies. I was even getting bites from cold applications, by making sure I was a VERY early applicant and I used multiple resume versions and picked the best fit for each application. Using the early interviews to get in \"interview shape\", I shook the rust off. By the end I was crushing every SQL question, every system design question, etc., behavioral questions (I created a bank of stories/responses to all the standard questions). My takeaway is that if you are Staff+ and a high performer, with an optimized LinkedIn/resume and some niche skills that are in demand, this job market is actually pretty good."
