      - heading "Chapter One" [level=2] [ref=e40]
      - heading "What the Heck is a Staff Designer?" [level=3] [ref=e41]
      - paragraph [ref=e42]: Staff designers can be incredible assets to a business. They have the power and experience to tackle exceptionally complicated user experience problems that unlock major revenue opportunities. And employers are noticing! In August of 2025, I searched for “staff product designer” roles on LinkedIn in the United States. More than 100 relevant roles were posted within seven days alone. Organizations are hungry to hire talent at this level, offering immense sums of money and incredible perks to the right individuals with relevant experience.
      - paragraph [ref=e43]: Despite its ubiquitousness in today’s job market, the staff designer role is still relatively new. The World Wide Web may be over 30 years old, but the career track for super-senior designers of internet-connected devices is a much more recent creation. Until recently, most designers were expected to shift into management at a later stage in their career. Design management has a stable foundation and decades of history built on various pre-existing forms of leadership theory.
      - paragraph [ref=e44]:
        - text: Once a designer becomes senior, the management track is made available to them. They can become a middle manager, eventually reach the director level, and potentially become a VP of design or chief design officer with enough effort. The progression is straightforward and predictable. Many designers do not want to manage people, though, and
        - text: "we should not force them to. Unhappy managers come with cascading negative effects: they create harm at scale by passing their pain along to every individual in their management chain."
      - paragraph [ref=e45]: The software engineering career track has a model for success that the design industry must follow. A considerable number of engineers have refrained from transitioning into people management, which led to the definition of the staff engineering career path. Engineers can stay close to code while tackling more and more ambiguous architecture problems as they advance in level. There are dozens of visible super-senior engineers who regularly share their experiences. The design field has to catch up.
      - paragraph [ref=e46]: "In the first year of teaching my staff designer course, I heard over 150 variations of the same predicament: the staff designer career path is opaque, and employers are unsure how to create ideal conditions for people who take on this role. The role of a staff designer is currently defined on a company-by-company basis. Some organizations don’t even have this path available at all, leaving individuals to advocate for themselves when they hit a career ceiling. Staff designers are set up to fail when the expectations of the role are unclear to everyone, including the companies who hired them."
      - paragraph [ref=e47]: "When career ladders across companies vary to this degree, designers lack the clarity to excel because they are cannot calibrate appropriately. And this difficulty is amplified when a designer attempts to transition their skill sets between companies—the standards at one employer may be completely different from another. In the open- source world, companies share technologies with each other because it pays off in faster advancements for all. The same applies to the staff designer role: universal expectations and standards can be shared between organizations for the benefit of the entire industry. These standards will help companies of all sizes establish better design practices, resulting in so many great things: more efficient internal operations, faster onboarding and seamless career growth for designers, and ultimately better outcomes for users."
      - paragraph [ref=e48]: This career path is still relatively nascent. We are progressing, and that progress comes with growing pains. Growing pains are frustrating and uncomfortable. On the bright side, it also means you’re part of the conversation. The decisions you make as you chart your own path will help create clarity for future designers.
      - paragraph [ref=e49]:
        - text: This book is a stake in the ground to set expectations for the role of a staff designer, and we’re starting with this chapter. You’ll find that most staff designers have strengths in some of the expected skills more than others. The reality is that there isn’t enough time in the day for designers to excel at everything all the time, and it’s unreasonable to be equally brilliant at every facet of the role. You’ll learn enough detail to decide where to invest your energy. You’ll also learn what a staff designer is
        - emphasis [ref=e50]: not
        - text: so you can set appropriate boundaries with collaborators and stakeholders. Let’s battle career ambiguity together!
      - heading "What a Staff Designer Is" [level=3] [ref=e51]
      - paragraph [ref=e52]:
        - text: A staff designer
        - emphasis [ref=e53]: is
        - text: a super-senior designer who does
        - emphasis [ref=e54]: not
        - text: manage individuals. Nonmanagers are colloquially referred to as
        - emphasis [ref=e55]: individual contributors
        - text: (ICs). Staff designers are individual contributors, but they are likely to be responsible for the design strategy and user experience quality of a major product area. Despite having no direct reports, staff designers are often extremely influential and valuable members of senior leadership.
      - paragraph [ref=e56]
      - paragraph [ref=e57]:
        - strong [ref=e58]: Figure 1
        - text: A common design career ladder based on insights from 75 organizations such as Netflix, Pinterest, and Shopify.
      - heading "Level-Setting" [level=4] [ref=e59]
      - paragraph [ref=e60]: I’ve reviewed career ladders from 75 tech companies, including major organizations such as Airbnb, Datadog, Instacart, Lattice, Microsoft, and Shopify. I merged these insights with my own personal observations from past employers and synthesized them into the most common career ladder you’ll find (Figure 1.1). I will mostly be concentrating on the role of a product designer, because this is currently the most common title that companies assign to digital experience designers. Product design, as defined here, is the combination of information architecture, visual design, and strategic product thinking. Much of this information is applicable to other related practices such as UX design, content design, and service design.
