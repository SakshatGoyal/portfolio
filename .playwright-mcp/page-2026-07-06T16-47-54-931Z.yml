        - emphasis [ref=e65]: staff
        - text: at another organization. Scale also affects this translation; for example, a principal designer at a 100-person company might be a senior designer at a 1,500-person company due to the scope and complexity of working at a larger organization. However, if a designer makes a lateral move to a company of a similar size but each company uses unique titles for the level above senior, the designer would likely be assigned the same level.
