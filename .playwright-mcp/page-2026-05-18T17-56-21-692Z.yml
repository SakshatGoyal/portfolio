    - heading "A website introducing Sidewalk Toronto and their plan for the city of tomorrow." [level=2] [ref=e49]
    - generic [ref=e54]:
      - img "lizvwells-casestudy-sidewalktoronto-sketch1" [ref=e57]
      - heading "SITE MAP SKETCH" [level=6] [ref=e61]
    - generic [ref=e64]:
      - heading "About the Project" [level=2] [ref=e72]
      - paragraph [ref=e78]: In March 2017, Waterfront Toronto issued Request for Proposals, a call for an innovation and funding partner for Toronto’s Eastern Waterfront. Sidewalk Labs, Alphabet Inc.'s urban innovation organization, responded with a vision to make Toronto the global hub for urban innovation. Two years later, Sidewalk Toronto and Waterfront Toronto have worked together to respond to the RFP by sharing their vision via a website and a 1000+ page book with Toronto’s city officials to lead to a vote on their bid.
    - generic [ref=e83]:
      - img "lizvwells-casestudy-sidewalktoronto-sketch2" [ref=e86]
      - heading "HOMEPAGE AND INNOVATIONS PAGE SKETCHES" [level=6] [ref=e90]: HOMEPAGE AND INNOVATIONS PAGE SKETCHES
    - generic [ref=e93]:
      - heading "UX Challenges" [level=2] [ref=e101]
      - generic [ref=e106]:
        - paragraph [ref=e107]: One of the main considerations I took into account when creating the information architecture for this site is the variety of users that will visit it. The primary audiences, Toronto residents and urban enthusiasts, come to the site for information such as the day-to-day effects of Sidewalk Toronto’s plan for Quayside, Sidewalk Toronto’s goals and mission statement, how to voice concerns and get involved to advocate for their community.
        - paragraph [ref=e108]: The secondary audience is Toronto’s local government, who would be voting on accepting SWT’s bid, and the local Toronto press. These two audiences visit the site for business reasons, such as looking for updates and following the progress of SWT, as well as accessing additional resources and press kits.
        - paragraph [ref=e109]: "There was a major dichotomy in how the site needed to present: the work needed to feel serious, answer a lot of questions, and have all of the details on the plans for development, but also inspire and excite Torontoians."
    - generic [ref=e114]:
      - img "lizvwells-casestudy-sidewalktoronto-desktopwires1" [ref=e117]
      - heading "DESKTOP WIREFRAMES" [level=6] [ref=e121]
    - generic [ref=e124]:
      - heading "UX Solutions" [level=2] [ref=e132]
      - paragraph [ref=e138]: To tackle the challenge of the two audiences tiers, I created an information architecture based on everyone’s needs. The primary audience’s key actions are featured in the primary navigation. We know that the majority of the users are coming to the site to better understand Quayside, and it’s important that that information is clearly displayed to users when they land to convey the feeling of transparency. The secondary navigation includes items like ‘Participate’, ‘Documents’, ‘FAQ’, and all other resources members of the local government and press would need to fully understand SWT.
    - generic [ref=e143]:
      - img "lizvwells-casestudy-sidewalktoronto-desktopwires2" [ref=e146]
      - heading "DESKTOP WIREFRAMES" [level=6] [ref=e150]
    - paragraph [ref=e161]: To balance the weight of the subject and volume of information, the page layouts use architectural renders, illustrations and infographics to clearly and transparently tell the story of Quayside. Informative pages ends with a PDF download of the proposal SWT submitted to the City of Toronto.
